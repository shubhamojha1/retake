[package]
name = "retake_render"
version = "0.1.0"
edition = "2021"
description = "Retake renderer: video spec in, MP4 out."

[lib]
name = "retake_render"
path = "src/lib.rs"

[[bin]]
name = "retake_render"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
